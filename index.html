<html>
    <head>
        <title></title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background: linear-gradient(135deg, #123531, #1B4440 50%, #2B5A54);
                font-family: Arial, sans-serif;
                color: #efcbae;
            }

            .menu-ribbon {
                width: 100%;
                background-color: transparent;
            }

            .menu-ribbon nav {
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                max-width: 1200px;
                height: 72px;
                margin: 0 auto;
                padding: 0 clamp(8px, 3vw, 24px);
            }

            #logo {
                width: clamp(64px, 20vw, 125px);
                height: auto;
                flex-shrink: 1;
            }

            .menu {
                display: flex;
                gap: clamp(12px, 2vw, 24px);
                margin: 0;
                padding: 0;
                list-style: none;
                margin-left: auto;
            }

            .menu a {
                display: block;
                padding: 12px clamp(4px, 1.5vw, 18px);
                border-radius: 6px;
                color: #FFFFFF;
                font-size: clamp(10px, 3.5vw, 16px);
                font-weight: 600;
                text-decoration: none;
                white-space: nowrap;
            }

            .menu a:hover,
            .menu a:focus {
                background-color: rgba(255, 255, 255, 0.14);
                color: #FFFFFF;
            }

            #splash {
                display: flex;
                width: 75%;
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
                margin: 2rem auto;
                text-align: center;
            }

            #logo-large {
                display: block;
                width: clamp(120px, 20vw, 150px);
                max-width: 100%;
                height: auto;
            }

            #splash h1,
            #splash h2 {
                font-family: Cambria, serif;
                margin: 0;
            }

            #splash h1 {
                font-size: clamp(2.5rem, 6vw, 4rem);
                letter-spacing: 0.2em;
            }

            #splash h2 {
                font-size: clamp(1rem, 2.4vw, 1.5rem);
            }

            #flow {
                height: 90px;
            }

            #splash h3 {
                margin: 0;
                font-weight: 400;
            }

            #splash button {
                margin-top: 0.25rem;
                padding: 18px 36px;
                border: 1px solid #efcbae;
                border-radius: 4px;
                background: transparent;
                color: #efcbae;
                font: inherit;
                font-size: 1.2rem;
                font-weight: 700;
                cursor: pointer;
                transition: background-color 0.2s ease, color 0.2s ease;
            }

            #splash button:hover,
            #splash button:focus-visible {
                background-color: #efcbae;
                color: #1B4440;
            }

        </style>
    </head>
